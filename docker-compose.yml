version: '3.8'

services:
  # Source database (Apache Cassandra)
  cassandra-source:
    image: cassandra:4.1
    container_name: cassandra_source
    ports:
      - "9042:9042" # Default Cassandra CQL port
    environment:
      - CASSANDRA_CLUSTER_NAME=SourceCluster
    volumes:
      - cassandra_data:/var/lib/cassandra

  # Target database (ScyllaDB)
  scylla-target:
    image: scylladb/scylla:latest
    container_name: scylla_target
    # Limit local resources to prevent system hang
    command: --smp 1 --memory 2G --developer-mode 1
    ports:
      - "9043:9042" # Map to host port 9043 to avoid conflict with Cassandra
    volumes:
      - scylla_data:/var/lib/scylla

  # Spark & Data Analysis environment (Jupyter Notebook)
  pyspark-notebook:
    image: jupyter/pyspark-notebook:latest
    container_name: pyspark_workspace
    ports:
      - "8888:8888" # Jupyter Web UI
      - "4040:4040" # Spark Web UI
    volumes:
      # Mount host project root to container working directory
      - ./:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes

volumes:
  cassandra_data:
  scylla_data:
